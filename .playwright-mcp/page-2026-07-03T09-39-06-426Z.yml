    - generic [ref=e292]:
      - generic [ref=e293]:
        - generic [ref=e294]: Gutters FAQs
        - heading "Good to know." [level=2] [ref=e295]
        - paragraph [ref=e296]:
          - text: Quick answers to the questions homeowners ask most about gutters. Have a different question?
          - link "Browse our full FAQ" [ref=e297] [cursor=pointer]:
            - /url: /faq
          - text: or call (201) 540-7772.
      - generic [ref=e298]:
        - generic [ref=e300]:
          - button "01 What are seamless gutters and why are they better?" [expanded] [ref=e301] [cursor=pointer]:
            - generic [ref=e302]: "01"
            - generic [ref=e303]: What are seamless gutters and why are they better?
            - img [ref=e305]
          - paragraph [ref=e309]: Seamless gutters are formed from one continuous piece of aluminum on-site to fit your roofline exactly. Because there are no joints along each run, there is nothing to separate, leak, or collect debris the way sectional gutters do — which is why they last longer and need far less maintenance.
        - generic [ref=e311]:
          - button "02 Do gutter guards actually work?" [ref=e312] [cursor=pointer]:
            - generic [ref=e313]: "02"
            - generic [ref=e314]: Do gutter guards actually work?
            - img [ref=e316]
          - paragraph [ref=e318]: Good ones do. We install micro-mesh and screen systems that block leaves, pine needles, and shingle grit while letting water through. They will not make gutters 100% maintenance-free, but they end the twice-a-year cleaning and dramatically cut clogs and overflow.
        - generic [ref=e320]:
          - button "03 Do I need new gutters or just a repair?" [ref=e321] [cursor=pointer]:
            - generic [ref=e322]: "03"
            - generic [ref=e323]: Do I need new gutters or just a repair?
            - img [ref=e325]
          - paragraph [ref=e327]: Sagging, separated seams, peeling paint or rust, water spilling over the front in rain, or gutters pulling away from the fascia usually mean replacement is the smarter fix. Isolated issues — a loose hanger or a clogged downspout — we simply repair. We tell you honestly which one you are looking at.
        - generic [ref=e329]:
          - button "04 Can bad gutters really damage my foundation?" [ref=e330] [cursor=pointer]:
            - generic [ref=e331]: "04"
            - generic [ref=e332]: Can bad gutters really damage my foundation?
            - img [ref=e334]
          - paragraph [ref=e336]: Yes. Gutters that overflow or dump water at the base of the house send thousands of gallons against your foundation, leading to basement leaks, cracks, and erosion. Correctly pitched gutters and extended downspouts are one of the cheapest ways to protect the most expensive part of your home.
        - generic [ref=e338]:
          - button "05 What size gutters do I need?" [ref=e339] [cursor=pointer]:
            - generic [ref=e340]: "05"
            - generic [ref=e341]: What size gutters do I need?
            - img [ref=e343]
          - paragraph [ref=e345]: Most homes are well served by 5-inch K-style gutters, but larger roofs, steep pitches, or homes that see heavy runoff often need 6-inch gutters with bigger downspouts. We size the system to your actual roof area and rainfall so it never overflows.
        - generic [ref=e347]:
          - button "06 Do you repair the soffit and fascia too?" [ref=e348] [cursor=pointer]:
            - generic [ref=e349]: "06"
            - generic [ref=e350]: Do you repair the soffit and fascia too?
            - img [ref=e352]
          - paragraph [ref=e354]: Yes. The fascia board gutters hang from and the soffit behind it are often where hidden rot starts. We inspect and replace any damaged wood before hanging new gutters, so they are mounted to something solid.
        - generic [ref=e356]:
          - button "07 How long does a gutter installation take?" [ref=e357] [cursor=pointer]:
            - generic [ref=e358]: "07"
            - generic [ref=e359]: How long does a gutter installation take?
            - img [ref=e361]
          - paragraph [ref=e363]: Most homes are completed in a single day. Because we form the gutters on-site, there is no waiting on custom orders — we measure, form, and hang in one visit.
